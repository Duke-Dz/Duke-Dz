name: Refresh contribution calendar

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Generate calendar from GitHub
        run: python3 scripts/update_activity.py
      - name: Save refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-light.svg assets/activity-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh contribution calendar"
          git pull --rebase origin main
          git push origin HEAD:main
